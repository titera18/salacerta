name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: salacerta_test
          POSTGRES_USER: salacerta
          POSTGRES_PASSWORD: salacerta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U salacerta"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://salacerta:salacerta@localhost:5432/salacerta_test
      SALACERTA_DATABASE_URL: postgresql+psycopg://salacerta:salacerta@localhost:5432/salacerta_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=salacerta --cov-report=term-missing
      - name: Migrações refletem os modelos
        run: |
          alembic upgrade head
          alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  stack:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Sobe a pilha completa
        run: docker compose up --build --detach --wait
      - name: Testa o frontend e a API pelo proxy
        run: |
          curl --fail --silent http://localhost:8080/ | grep -q SalaCerta
          curl --fail --silent -X POST http://localhost:8080/api/rooms \
            -H "Content-Type: application/json" \
            -d '{"name": "Aurora", "capacity": 8}'
          curl --fail --silent http://localhost:8080/api/rooms | grep -q Aurora
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs
