services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: salacerta
      POSTGRES_USER: salacerta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salacerta}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salacerta -d salacerta"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      SALACERTA_DATABASE_URL: postgresql+psycopg://salacerta:${POSTGRES_PASSWORD:-salacerta}@db:5432/salacerta
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
